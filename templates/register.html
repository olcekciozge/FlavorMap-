{% extends 'base.html' %}
{% block content %}

<h2>Register</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password">
    <input type="password" name="confirm">
    <button type="submit">Register</button>
</form>

{% endblock %}
