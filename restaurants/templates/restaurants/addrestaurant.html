{% extends "main.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/card.css' %}">
<main>
<h2 style="color: #7a1212; text-align: center; font-size: 2.2rem; margin-top: 30px; font-weight: bold;">
    Add Your Restaurant
</h2>
<div class="container" style="display: flex; justify-content: center; padding: 20px 30px 0;">

    <div style="
        background-color: #ffffff;
        width: 100%;
        max-width: 650px;
        padding: 40px;
        border-radius: 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    ">
        <form action="{% url 'restaurants:create' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Restaurant Name</label>
                <input type="text" name="name" placeholder="" required style="
                    width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box;
                ">
            </div>

            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">City</label>
                    <select name="city" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                        <option value=""></option>
                        {% for city in cities %}
                        <option value="{{ city.id }}">{{ city.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">District</label>
                    <input type="text" name="district" style="
                        width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box;
                    ">
                    <input type="text" name="latitude" placeholder="Latitude">
                    <input type="text" name="longitude" placeholder="Longitude">
                </div>
            </div>

            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Category</label>
                    <select name="categories" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                        <option value=""></option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Price Level</label>
                    <select name="price_range" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                        <option value="1">€</option>
                        <option value="2">€€</option>
                        <option value="3">€€€</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Description</label>
                <textarea name="description" placeholder="Tell us about your restaurant..." style="
                    width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px; box-sizing: border-box;
                "></textarea>
            </div>

            <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Menu Items</label>
                <a href="{% url 'restaurants:add_menu' %}">+ Add New Menu</a>
            <select name="menus" multiple style="
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px;
            ">
            {% for menu in menus %}
            <option value="{{ menu.id }}">{{ menu.name }} - {{ menu.price }} {{ menu.get_currency_display }}</option>
            {% endfor %}
            </select>
            <small style="color: #666;">Hold Ctrl (or Cmd) to select multiple items.</small>
            </div>

            <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Opening Hours</label>
                <a href="{% url 'restaurants:add_opening_hour' %}">
                     + Add Opening Hours
                </a>
            <select name="time" multiple style="
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px;
            ">
            {% for hour in opening_hours %}
            <option value="{{ hour.id }}">{{ hour }}</option>
            {% endfor %}
            </select>
            <small style="color: #666;">Select the operational hours for this restaurant.</small>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Restaurant Photo</label>
                <input type="file" name="image" accept="image/*" style="width: 100%;">
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">
                    Extra Photos
                </label>
                <input type="file" name="images" multiple accept="image/*" style="width: 100%;">
                <small style="color: #666;">You can upload multiple images.</small>
            </div>

            <button type="submit" style="
                background-color: #7a1212;
                color: white;
                width: 100%;
                padding: 15px;
                border: none;
                border-radius: 10px;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: opacity 0.3s;
            " onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                Create Restaurant
            </button>
        </form>
    </div>
</div>

</main>
{% endblock %}
