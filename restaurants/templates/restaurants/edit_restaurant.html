{% extends "main.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/card.css' %}">
<main>
<h2 style="color: #7a1212; text-align: center; font-size: 2.2rem; margin-top: 30px; font-weight: bold;">
    Edit Restaurant: {{ restaurant.name }}
</h2>
<div class="container" style="display: flex; justify-content: center; padding: 20px 30px 0;">
    <div style="background-color: #ffffff; width: 100%; max-width: 650px; padding: 40px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Restaurant Name</label>
                <input type="text" name="name" value="{{ restaurant.name }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box;">
            </div>

            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">City</label>
                    <select name="city" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                        {% for city in cities %}
                        <option value="{{ city.id }}" {% if city.id == restaurant.city.id %}selected{% endif %}>{{ city.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">District</label>
                    <input type="text" name="district" value="{{ restaurant.district }}" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box;">
                </div>
            </div>

            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Category</label>
                    <select name="categories" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}"
                    {% if cat in restaurant.categories.all %} selected {% endif %}>
                    {{ cat.name }}
                    </option>
                    {% endfor %}
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Price Level</label>
                    <select name="price_range" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px;">
                        <option value="1" {% if restaurant.price_range == 1 %}selected{% endif %}>€</option>
                        <option value="2" {% if restaurant.price_range == 2 %}selected{% endif %}>€€</option>
                        <option value="3" {% if restaurant.price_range == 3 %}selected{% endif %}>€€€</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Description</label>
                <textarea name="description" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px; box-sizing: border-box;">{{ restaurant.description }}</textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Menu Items</label>
                <select name="menus" multiple style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px;">
                    {% for menu in menus %}
                        <option value="{{ menu.id }}" {% if menu in restaurant.menus.all %}selected{% endif %}>
                            {{ menu.name }} - {{ menu.price }} {{ menu.get_currency_display }}
                        </option>
                    {% endfor %}
                </select>
                <small style="color: #666;">Hold Ctrl (or Cmd) to select multiple items.</small>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Opening Hours</label>
                <select name="time" multiple style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; min-height: 100px;">
                    {% for hour in opening_hours %}
                        <option value="{{ hour.id }}" {% if hour in restaurant.time.all %}selected{% endif %}>
                            {{ hour }}
                        </option>
                    {% endfor %}
                </select>
                <small style="color: #666;">Select the operational hours for this restaurant.</small>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Restaurant Photo</label>
                {% if restaurant.image %}
                    <div style="margin-bottom: 10px;">
                        <span style="display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px;">Current Photo:</span>
                        <img src="{{ restaurant.image.url }}" style="width: 120px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #ddd;">
                    </div>
                {% endif %}
                <input type="file" name="image" accept="image/*" style="width: 100%;">
            </div>

            <button type="submit" style="
                background-color: #7a1212;
                color: white;
                width: 100%;
                padding: 15px;
                border: none;
                border-radius: 10px;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: opacity 0.3s;
            " onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                Update Restaurant
            </button>
        </form>
    </div>
</div>
</main>
{% endblock %}
